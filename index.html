<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroCasino</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Sora:wght@400;500;600&family=Poppins:wght@700;800;900&display=swap');

  :root{
    --bg:#0b0616;
    --panel:#1a0f30;
    --panel-2:#241640;
    --line:#4a2f70;
    --text:#f7f0ff;
    --dim:#b7a3d6;
    --gold:#ffd76a;
    --gold-bright:#ffe9a8;
    --royal:#a855f7;

    --slots:#ffd76a;
    --roulette:#e879f9;
    --mines:#a78bfa;
    --crash:#fbbf24;
    --coinflip:#8b5cf6;
    --blackjack:#f0c419;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:
      radial-gradient(circle at 8% -5%, #2d1454 0%, transparent 42%),
      radial-gradient(circle at 95% 10%, #3a2308 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, #3a0f42 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Sora',-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  #stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  #stars span{
    position:absolute; width:2px; height:2px;
    background:var(--gold-bright); border-radius:50%; opacity:.5;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }

  .wrap{
    max-width:1240px; margin:0 auto;
    padding:48px 28px 80px;
    position:relative; z-index:1;
  }

  .brand{
    display:flex; flex-direction:column; align-items:center;
    text-align:center; margin-bottom:40px;
  }
  .brand svg{
    width:46px; height:46px; color:var(--gold);
    filter:drop-shadow(0 6px 14px rgba(255,215,106,.45));
    margin-bottom:10px;
  }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:34px; font-weight:800; letter-spacing:.4px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold) 60%, #c9932f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand p{
    margin-top:6px; font-size:13px; color:var(--dim);
    letter-spacing:.3px;
  }

  .bento{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
  }
  .bento:has(.tile:only-child){
    grid-template-columns:1fr; max-width:420px; margin:0 auto;
  }
  @media(max-width:980px){ .bento{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:620px){ .bento{ grid-template-columns:1fr; } }

  .tile{
    --c:var(--cat, #22e5d0);
    position:relative;
    min-height:230px;
    border-radius:22px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent) inset,
      0 12px 26px -16px color-mix(in srgb, var(--c) 55%, transparent);
    padding:24px;
    cursor:pointer;
    overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    text-decoration:none; color:inherit;
    transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s ease, filter .22s ease;
  }
  .tile::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%);
    z-index:0;
  }
  .tile::before{
    content:"";
    position:absolute; left:18px; right:18px; top:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--c), transparent);
    opacity:.8; z-index:2;
  }
  .tile:hover{
    transform:translateY(-7px) scale(1.015);
    box-shadow:
      0 0 0 1.5px var(--c) inset,
      0 22px 40px -16px color-mix(in srgb, var(--c) 70%, transparent);
    filter:brightness(1.06);
  }
  .tile:active{ transform:translateY(-2px) scale(.985); }

  .tile[data-cat="slots"]{ --cat:var(--slots); }
  .tile[data-cat="roulette"]{ --cat:var(--roulette); }
  .tile[data-cat="mines"]{ --cat:var(--mines); }
  .tile[data-cat="crash"]{ --cat:var(--crash); }
  .tile[data-cat="coinflip"]{ --cat:var(--coinflip); }
  .tile[data-cat="blackjack"]{ --cat:var(--blackjack); }

  .tile-icon{ position:relative; z-index:2; }
  .tile-icon svg.glogo{
    width:64px; height:64px; display:block; color:var(--c);
    filter:drop-shadow(0 8px 18px color-mix(in srgb, var(--c) 55%, transparent));
    transition:transform .22s cubic-bezier(.2,.8,.3,1);
  }
  .tile:hover .tile-icon svg.glogo{ transform:scale(1.06) rotate(-3deg); }

  .tile h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:23px; font-weight:700; color:#fff;
    position:relative; z-index:2;
  }
  .tile .cat-sub{
    font-size:12.5px; color:var(--dim); margin-top:5px;
    position:relative; z-index:2; max-width:230px;
  }

  .tag{
    position:absolute; top:16px; right:16px; z-index:3;
    font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    padding:5px 10px; border-radius:999px;
    background:color-mix(in srgb, var(--c) 18%, transparent);
    color:var(--c);
    border:1px solid color-mix(in srgb, var(--c) 40%, transparent);
  }

  /* ---- bandeau AstroCasino ---- */
  #astro-header{ position:relative; z-index:50; font-family:'Sora',sans-serif; color:#f7f0ff; }
  .astro-bar{
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
    max-width:1240px; margin:0 auto; padding:22px 22px 18px;
  }
  .astro-bar__brand{ display:flex; flex-direction:column; }
  .astro-bar__cards{ display:flex; align-items:stretch; gap:14px; flex-wrap:wrap; }
  .astro-card{
    background:linear-gradient(180deg,#160d26,#120a1f);
    border:1px solid #2e1f4a; border-radius:14px;
    padding:12px 18px; min-width:150px;
    display:flex; flex-direction:column; justify-content:center; gap:6px;
  }
  .astro-card__label{ font-size:10px; letter-spacing:1.6px; font-weight:700; text-transform:uppercase; color:#8b7aa8; }
  .astro-solde{ display:flex; align-items:center; gap:9px; }
  .astro-coin{
    width:22px; height:22px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 34% 30%,#ffe9a8,#ffd76a 55%,#b9820f);
    box-shadow:0 0 10px -2px rgba(255,215,106,.8);
    display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:800; color:#3a2600; font-family:'Space Grotesk',sans-serif;
  }
  .astro-solde b{ font-size:21px; font-weight:800; font-family:'Space Grotesk','Sora',sans-serif; }
  .astro-code{ display:flex; align-items:center; gap:10px; }
  .astro-code code{ font-family:'Space Grotesk','Sora',monospace; font-size:19px; font-weight:800; letter-spacing:3px; color:#ffd76a; }
  .astro-copy{
    background:none; border:1px solid #3a2a5c; border-radius:7px;
    width:26px; height:26px; cursor:pointer; color:#b7a3d6;
    display:flex; align-items:center; justify-content:center; padding:0; transition:.15s;
  }
  .astro-copy:hover{ color:#fff; border-color:#a855f7; }
  .astro-copy.ok{ color:#2be08a; border-color:#2be08a; }
  .astro-hint{ font-size:10.5px; color:#6f5f8c; }
  .astro-pay{
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid #a855f7; border-radius:10px;
    padding:10px 18px; font-size:13px; font-weight:700;
    color:#d8b4fe; background:none; text-decoration:none; cursor:pointer; transition:.18s;
  }
  .astro-pay:hover{ background:rgba(168,85,247,.16); color:#fff; }
  .astro-pay[aria-disabled="true"]{ opacity:.45; cursor:not-allowed; }
  .astro-id{ max-width:1240px; margin:0 auto; padding:0 22px 10px; font-size:10px; color:#4e4270; letter-spacing:.3px; }
  @media(max-width:760px){
    .astro-bar{ justify-content:center; text-align:center; }
    .astro-bar__brand{ align-items:center; }
    .astro-card{ min-width:130px; }
  }
</style>
</head>
<body>
<div id="stars"></div>

<div id="astro-header">
  <div class="astro-bar">
    <div class="astro-bar__brand">
      <h2 style="font-family:'Poppins','Space Grotesk','Sora',sans-serif;font-size:64px;font-weight:800;letter-spacing:-1px;line-height:1;margin:0;padding:0;">
        <span style="background:linear-gradient(90deg,#a855f7,#c084fc 55%,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent;">Astro</span
        ><span style="color:#fff;">Casino</span>
      </h2>
      <span style="display:block;margin-top:6px;font-family:'Poppins','Sora',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:#7b6a99;text-transform:uppercase;">ASTRO <b style="color:#a855f7;">RP</b></span>
    </div>
    <div class="astro-bar__cards">
      <div class="astro-card">
        <div class="astro-card__label">Solde</div>
        <div class="astro-solde"><div class="astro-coin">AC</div><b id="astro-solde">0</b></div>
      </div>
      <div class="astro-card">
        <div class="astro-card__label">Mon code boutique</div>
        <div class="astro-code">
          <code id="astro-code">------</code>
          <button class="astro-copy" id="astro-copy" title="Copier le code" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
        <div class="astro-hint">Donne ce code à l'admin pour recevoir des Coins</div>
      </div>
      <div class="astro-card">
        <div class="astro-card__label">Paiement</div>
        <span class="astro-pay" id="astro-pay-slot" aria-disabled="true">Payer via PayPal</span>
      </div>
    </div>
  </div>
  <div class="astro-id">ID joueur : <span id="astro-id"></span></div>
</div>

<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 64 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4 30l4-18 10 10 14-18 14 18 10-10 4 18z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="8" cy="10" r="3" fill="currentColor"/>
      <circle cx="32" cy="6" r="3.4" fill="currentColor"/>
      <circle cx="56" cy="10" r="3" fill="currentColor"/>
      <rect x="4" y="30" width="56" height="4" rx="1.6" fill="currentColor"/>
    </svg>
    <h1>AstroCasino</h1>
    <p>La salle de jeux royale — choisis ta table</p>
  </div>
  <div class="bento">
<a href="slots.html" class="tile" data-cat="slots">
      <span class="tag">Populaire</span>
      <div class="tile-icon"><svg class="glogo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<rect x="8" y="10" width="42" height="44" rx="7" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="2.6"/>
<rect x="13" y="16" width="32" height="18" rx="4" fill="#0b0616" stroke="currentColor" stroke-width="2"/>
<path d="M23.7 16v18M34.3 16v18" stroke="currentColor" stroke-width="1.8" stroke-opacity=".6"/>
<text x="18.4" y="29.6" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="800" fill="currentColor">7</text>
<circle cx="29" cy="25" r="4" fill="currentColor"/>
<rect x="36" y="22" width="7" height="6" rx="1.6" fill="currentColor"/>
<rect x="15" y="39" width="28" height="4.5" rx="2.2" fill="currentColor" fill-opacity=".45"/>
<rect x="15" y="46" width="17" height="4" rx="2" fill="currentColor" fill-opacity=".25"/>
<path d="M50 40V24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<circle cx="50" cy="20" r="5" fill="currentColor"/></svg></div>
      <div>
        <h3>Machines à Sous</h3>
        <div class="cat-sub">3 rouleaux, symboles spéciaux et un jackpot progressif à décrocher.</div>
      </div>
    </a>

  </div>
</div>

<script src="astro2.js"></script>
<script>
  const stars = document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*4) + 's';
    stars.appendChild(s);
  }
</script>
</body>
</html>
